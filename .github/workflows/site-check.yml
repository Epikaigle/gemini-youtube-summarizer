name: Site checks

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/site-check.mjs"
      - ".github/workflows/site-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/site-check.mjs"
      - ".github/workflows/site-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site
        run: node scripts/site-check.mjs
