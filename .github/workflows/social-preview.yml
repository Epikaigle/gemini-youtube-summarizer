name: Generate social preview

on:
  push:
    branches: [main]
    paths:
      - "docs/assets/social-preview.svg"
      - ".github/workflows/social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1

      - name: Render PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="docs/assets/social-preview.svg",
              write_to="docs/assets/social-preview.png",
              output_width=1200,
              output_height=630,
          )
          PY

      - name: Commit generated preview
        run: |
          if git diff --quiet -- docs/assets/social-preview.png && git ls-files --error-unmatch docs/assets/social-preview.png >/dev/null 2>&1; then
            echo "social-preview.png is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/social-preview.png
          git commit -m "site: generate social preview PNG"
          git push
