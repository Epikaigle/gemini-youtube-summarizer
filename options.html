<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Options - Résumé YouTube par Gemini</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <section class="panel" aria-labelledby="title">
      <h1 id="title">Résumé YouTube par Gemini</h1>
      <p class="intro">
        Personnalise le texte envoyé à Gemini avant le lien de la vidéo.
      </p>

      <form id="options-form">
        <label for="prompt-prefix">Texte avant le lien YouTube</label>
        <textarea
          id="prompt-prefix"
          name="prompt-prefix"
          rows="5"
          maxlength="1200"
          spellcheck="true"
        ></textarea>

        <div class="hint">
          Le lien est ajouté automatiquement. Laisse le champ vide pour envoyer uniquement le lien.
        </div>

        <div class="preview" aria-live="polite">
          <span class="preview-label">Aperçu envoyé à Gemini</span>
          <pre id="prompt-preview"></pre>
        </div>

        <div class="actions">
          <button type="submit">Enregistrer</button>
          <button type="button" id="reset-button" class="secondary">Réinitialiser</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
